<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный бюджет</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--ink:#14222f;--mut:#63717d;--line:#d5dde3;--fld:#fff;--a:#2456a6;--b:#c58a12;--btn:#14222f;--btnt:#fff;--err:#b3261e;--pos:#1b7a43;--f:#2a8a6a;--ta:#dfe8f6;--tb:#f5e9cf;--tf:#d7ede4;--ona:#fff;--onb:#14222f;--onf:#fff;--cr:#c9503a;--tcr:#fbe3dd;--ocr:#fff;--ci:#0e7c86;--tci:#d8eef0;--oci:#fff;--cp:#6f45ad;--tcp:#e9e1f5;--ocp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--ink:#e8eef2;--mut:#8b9aa6;--line:#26333e;--fld:#182430;--a:#6f9be6;--b:#e0a83a;--btn:#e8eef2;--btnt:#101820;--err:#ff8a80;--pos:#5fd08a;--f:#58c9a0;--ta:#1d2c44;--tb:#3a2f17;--tf:#183a30;--ona:#101820;--onb:#101820;--onf:#101820;--cr:#f08a72;--tcr:#3d2019;--ocr:#101820;--ci:#4fc3cf;--tci:#14343a;--oci:#101820;--cp:#b79cf0;--tcp:#2b2145;--ocp:#101820}}
:root[data-theme="dark"]{--cr:#f08a72;--tcr:#3d2019;--ocr:#101820;--ci:#4fc3cf;--tci:#14343a;--oci:#101820;--cp:#b79cf0;--tcp:#2b2145;--ocp:#101820;--ta:#1d2c44;--tb:#3a2f17;--tf:#183a30;--ona:#101820;--onb:#101820;--onf:#101820;--f:#58c9a0;--err:#ff8a80;--pos:#5fd08a;--bg:#101820;--ink:#e8eef2;--mut:#8b9aa6;--line:#26333e;--fld:#182430;--a:#6f9be6;--b:#e0a83a;--btn:#e8eef2;--btnt:#101820}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:18px 18px 96px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 14px}
.num{font-family:Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:8px 2px;min-height:52px;border:0;background:none;color:var(--mut);font:600 14px system-ui,sans-serif;line-height:1.15}
.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--fld);color:var(--ink);font:inherit}
input#amt{font:600 30px Georgia,serif;padding:10px 12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--fld);color:var(--ink);font:600 16px system-ui,sans-serif}
.seg button.on.p0{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.seg button.on.p1{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--fld);color:var(--ink);font:15px system-ui,sans-serif}
.cats button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);font:600 17px system-ui,sans-serif}
.msg{min-height:20px;margin-top:8px;color:var(--mut);font-size:14px}
h2{font:600 18px Georgia,serif;margin:26px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}.row .s{font-size:13px;color:var(--mut)}
.row .x{border:0;background:none;color:var(--mut);font-size:20px;padding:4px 8px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button{border:0;background:none;color:var(--ink);font-size:26px;padding:4px 14px}
.nav b{font:600 18px Georgia,serif;text-transform:capitalize}
.big{font-size:44px;line-height:1.1;margin:6px 0 12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.who{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat .h{display:flex;justify-content:space-between;margin-bottom:6px}
.empty{color:var(--mut);padding:18px 0}
.tiny{margin-top:22px;font-size:13px;color:var(--mut)}
.tiny button{border:0;background:none;color:var(--mut);text-decoration:underline;font:inherit;padding:0}
.seg.t{margin-bottom:6px}
.seg.t button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
input#amt{border:2px solid var(--ink)}
.err{color:var(--err)}
.pos{color:var(--pos)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.emo button{font-size:22px;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--fld)}
.emo button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lk{border:0;background:none;color:var(--a);font:600 15px system-ui,sans-serif;padding:6px 0}
.ed{padding:14px 0;border-bottom:1px solid var(--line)}
.ed .two{display:flex;gap:8px;margin-top:14px}
.ed .two button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--fld);color:var(--ink);font:600 15px system-ui,sans-serif}
.ed .two .ok{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.seg.fam{margin-bottom:8px}
.seg.fam button.on{border-color:var(--f);box-shadow:inset 0 0 0 1px var(--f)}
.mv{border:1px solid var(--line);border-radius:6px;background:var(--fld);color:var(--ink);padding:4px 9px;font-size:16px;margin-left:3px}
.mv:disabled{opacity:.3}
.up{position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;padding:10px 14px;border:0;border-radius:20px;background:var(--btn);color:var(--btnt);font:600 14px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.up.show{display:block}
body{position:relative}
.gear{position:absolute;top:14px;right:max(14px,calc((100% - 480px)/2 + 14px));width:44px;height:44px;border:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;z-index:2}
.gear.on{color:var(--ink)}
h1{padding-right:48px}
.seg button.p0{background:var(--ta);border-color:var(--a)}
.seg button.on.p0{background:var(--a);color:var(--ona);box-shadow:none}
.seg button.p1{background:var(--tb);border-color:var(--b)}
.seg button.on.p1{background:var(--b);color:var(--onb);box-shadow:none}
.seg button.p2{background:var(--tf);border-color:var(--f)}
.seg button.on.p2{background:var(--f);color:var(--onf);box-shadow:none}

.stk{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:1;padding:0 0 8px;margin-top:6px}
.stt{font-size:14px;margin-top:6px;min-height:20px}
mark{background:#ffe58a;color:#14222f;border-radius:3px;padding:0 1px}
.addrow{background:var(--tcp);border:2px dashed var(--cp);border-radius:8px;padding:10px 12px}
.go{background:var(--cp);color:var(--ocp)}
.lk{color:var(--cp);background:var(--tcp);border-radius:8px;padding:8px 12px}
.cats button{background:var(--tcp);border-color:var(--cp);color:var(--ink)}
.cats button.on{background:var(--cp);color:var(--ocp);border-color:var(--cp);box-shadow:none}
.seg.t button[data-t="e"]{background:var(--tcr);border-color:var(--cr)}
.seg.t button[data-t="e"].on{background:var(--cr);color:var(--ocr);box-shadow:none}
.seg.t button[data-t="i"],.seg.t button[data-md="buy"],.seg.t button[data-k="0"]{background:var(--tci);border-color:var(--ci)}
.seg.t button[data-t="i"].on,.seg.t button[data-md="buy"].on,.seg.t button[data-k="0"].on{background:var(--ci);color:var(--oci);box-shadow:none}
.seg.t button[data-md="all"],.seg.t button[data-k="1"]{background:var(--tcp);border-color:var(--cp)}
.seg.t button[data-md="all"].on,.seg.t button[data-k="1"].on{background:var(--cp);color:var(--ocp);box-shadow:none}
.emo button{background:var(--tcp);border-color:var(--tcp)}
.emo button.on{background:var(--cp);border-color:var(--cp);box-shadow:none}
.mv{background:var(--tcp);border-color:var(--cp);color:var(--cp)}
.x{color:var(--cr);font-size:24px}
.up{background:var(--cp);color:var(--ocp)}
.gear{color:var(--cp)}
.gear.on{background:var(--tcp);border-radius:10px}
.tabs{background:var(--tcp)}
.tabs button{color:var(--ink)}
.tabs button.on{color:var(--cp);box-shadow:inset 0 3px 0 var(--cp)}
.nav button{color:var(--cp);background:var(--tcp);border-radius:10px}
.ed .two button{background:var(--tcp);border-color:var(--cp)}
.ed .two .ok{background:var(--cp);color:var(--ocp);border-color:var(--cp)}
.ed .two button[data-a="x"]{background:var(--tcr);border-color:var(--cr)}
.ed .two .ok[data-a="d"]{background:var(--cr);color:var(--ocr);border-color:var(--cr)}
</style>
</head>
<body>
<button class="gear" id="t2" aria-label="Настройки" title="Настройки"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
<div class="wrap" id="app"></div>
<div class="tabs"><button id="t0">Доходы/<wbr>Расходы</button><button id="t1">Итоги</button><button id="t3">Покупки</button></div>
<button class="up" id="up" aria-label="Наверх">↑ Наверх</button>
<script>
var DEFE=[["Продукты","🛒",0],["Дом","🏠",1],["Транспорт","🚗",2],["Здоровье","💊",3],["Отдых","🎈",4],["Прочее","📦",5]];
var DEFI=[["Зарплата","💼",0],["Пособия","👶",1],["Подработка","🛠\uFE0F",2],["Прочее","💰",3]];
var SEC=[["Продукты","🛒",0,1],["Бытовая химия","🧽",1,1],["Одежда","👕",2],["Стройматериалы","🧱",3],["Электроника","💻",4],["Список желаний","⭐",5]],CATS=DEFE,INC=DEFI,NX=100;
try{var z=JSON.parse(localStorage.getItem("cats")||"null");if(z&&z.e&&z.i){CATS=z.e;INC=z.i;NX=z.nx||100;if(z.s){SEC=z.s;if(!z.v)SEC.forEach(function(c){if(c[2]<2)c[3]=1})}}}catch(e){}
function saveC(){try{localStorage.setItem("cats",JSON.stringify({e:CATS,i:INC,s:SEC,v:2,nx:NX}))}catch(e){}}
var EM=["🛒","🍎","🥖","☕","🍽\uFE0F","🏠","💡","🔧","🛋\uFE0F","🚗","⛽","🚌","🚲","✈\uFE0F","💊","🏥","🦷","👕","👟","🎈","🎬","🎁","📚","🎓","👶","🧸","🐶","🐱","💇","🧴","📱","💻","🌐","🧽","🧹","🔨","🧱","🎧","⭐","🏋\uFE0F","🎮","🎵","💳","📦","💼","💰","🏦","🛠\uFE0F","📈","💵"];
var WHO=["Александр","Оксана","Семья"],COL=["var(--a)","var(--b)","var(--f)"],nmsg="";
var CURS={EUR:["€","Евро","de-DE"],CZK:["Kč","Чешская крона","cs-CZ"],USD:["$","Доллар США","en-US"],RUB:["₽","Российский рубль","ru-RU"]},CUR="EUR";
try{var cu=localStorage.getItem("cur");if(cu&&CURS[cu])CUR=cu}catch(e){}
try{var nm=JSON.parse(localStorage.getItem("names")||"null");if(nm&&nm.length==3)WHO=nm}catch(e){}
var now=new Date(),mo=new Date(now.getFullYear(),now.getMonth(),1),view=0,cur={t:"e",who:0,cat:0},msg="",bad=false,ed=null,eix=null,lim=10,prev=0;
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dm(n){return ds(new Date(now.getFullYear(),now.getMonth(),n))}
function LST(t){return t=="i"?INC:t=="s"?SEC:CATS}
function cat(t,id){var L=LST(t);for(var k=0;k<L.length;k++)if(L[k][2]==id)return L[k];return["Без категории","❔",id]}
function ensure(){var L=LST(cur.t);if(!L.some(function(c){return c[2]==cur.cat}))cur.cat=L.length?L[0][2]:null}
var shop=[],shopSec=null,col={},smode="buy",sq="",lastB=null;
try{shop=JSON.parse(localStorage.getItem("shop")||"[]")}catch(e){}
shop.forEach(function(x){if(isCat(x.s)&&x.b===undefined)x.b=x.d?0:1});
function saveS(){try{localStorage.setItem("shop",JSON.stringify(shop))}catch(e){}}
var items=null;
try{items=JSON.parse(localStorage.getItem("exp")||"null")}catch(e){}
if(!items){items=[{a:64.2,w:0,c:0,d:dm(2),n:"Wocheneinkauf"},{a:38.5,w:1,c:0,d:dm(5),n:""},{a:120,w:0,c:1,d:dm(7),n:"Ремонт стиральной машины"},{a:49,w:1,c:2,d:dm(9),n:"Deutschlandticket"},{a:27.9,w:1,c:3,d:dm(12),n:"Apotheke"},{a:35,w:0,c:4,d:dm(14),n:"Кино"},{a:2400,w:0,c:0,d:dm(1),n:"",t:"i"},{a:250,w:1,c:1,d:dm(3),n:"",t:"i"}];items.forEach(function(x){x.demo=1})}
function save(){try{localStorage.setItem("exp",JSON.stringify(items))}catch(e){}}
function eur(n){try{return n.toLocaleString(CURS[CUR][2],{style:"currency",currency:CUR})}catch(e){return n.toFixed(2)+" "+CURS[CUR][0]}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function inMonth(){return items.filter(function(i){return i.d.slice(0,7)===key(mo)})}
function dd(s){var p=s.split("-");return p[2]+"."+p[1]+"."}
function g(id){return document.getElementById(id)}
function bar3(b,s,st){return '<div class="bar"'+(st?' style="'+st+'"':"")+'>'+[0,1,2].map(function(k){return '<i style="width:'+(s?b[k]/s*100:0)+'%;background:'+COL[k]+'"></i>'}).join("")+'</div>'}
function who3(b){return WHO.map(function(w,k){return w+" "+eur(b[k])}).join(", ")}
function add(){
  ensure();
  if(cur.cat===null){msg="Сначала добавьте категорию на вкладке «Категории».";bad=true;keep();return}
  var a=parseFloat(g("amt").value.replace(/\s/g,"").replace(",","."));
  if(!(a>0)){msg="Введите сумму цифрами, например 12,50.";bad=true;keep();g("amt").focus();return}
  var d=g("dt").value||ds(now),n=g("nt").value.trim(),it=cur.t=="i";
  var o={a:a,w:cur.who,c:cur.cat,d:d,n:n};if(it)o.t="i";if(eix!==null&&items[eix]){items[eix]=o;msg="Запись изменена.";eix=null}else{items.push(o);msg="Добавлено: "+eur(a)+", "+cat(cur.t,cur.cat)[0]+", "+WHO[cur.who]+"."}save();
  bad=false;
  var m=new Date(d+"T00:00:00");mo=new Date(m.getFullYear(),m.getMonth(),1);draw()
}
function del(i){items.splice(i,1);eix=null;save();draw()}
function startEdit(i){var x=items[i];if(!x)return;eix=i;cur.t=x.t=="i"?"i":"e";cur.who=x.w;cur.cat=x.c;msg="";bad=false;draw();g("amt").value=String(x.a).replace(".",",");g("dt").value=x.d;g("nt").value=x.n||"";window.scrollTo(0,0)}
function clearDemo(){items=items.filter(function(x){return !x.demo});save();draw()}
function edHtml(){
  var h='<div class="ed"><label for="en">Название</label><input id="en" value="'+esc(ed.n)+'" placeholder="Например, Кафе" autocomplete="off"><label>Картинка</label><div class="emo">'+EM.map(function(e){return '<button data-e="'+e+'"'+(ed.e==e?' class="on"':"")+'>'+e+'</button>'}).join("")+'</div>';
  if(ed.t=="s")h+='<label>Тип раздела</label><div class="seg t"><button class="'+(ed.k?"on":"")+'" data-k="1">Каталог</button><button class="'+(ed.k?"":"on")+'" data-k="0">Разовый список</button></div><div class="s" style="font-size:13px;color:var(--mut);margin-top:6px">Каталог: пункты остаются в списке, вы отмечаете, что нужно купить. Разовый список: купленное можно убрать.</div>';
  if(ed.conf)h+='<div class="msg err">Записи с этой категорией останутся без категории. Удалить?</div><div class="two"><button data-a="c">Отмена</button><button class="ok" data-a="d">Да, удалить</button></div>';
  else{h+='<div class="msg err">'+esc(ed.err||"")+'</div><div class="two"><button data-a="c">Отмена</button>'+(ed.id!==null?'<button data-a="x">Удалить</button>':"")+'<button class="ok" data-a="s">Сохранить</button></div>'}
  return h+'</div>'
}
function mvb(t,id,d,txt,off){return '<button class="mv" data-mv="'+t+":"+id+":"+d+'"'+(off?" disabled":"")+' aria-label="'+({top:"В начало",up:"Выше",down:"Ниже"})[d]+'">'+txt+'</button>'}
function isCat(id){for(var k=0;k<SEC.length;k++)if(SEC[k][2]===id)return !!SEC[k][3];return false}
function shopHtml(){
  if(!SEC.some(function(c){return c[2]===shopSec}))shopSec=SEC.length?SEC[0][2]:null;
  var h='<h1>Покупки</h1>';
  if(!SEC.length)return h+'<div class="empty">Добавьте разделы в настройках (значок шестерёнки).</div>';
  h+='<div class="seg t"><button class="'+(smode=="buy"?"on":"")+'" data-md="buy">Купить</button><button class="'+(smode=="all"?"on":"")+'" data-md="all">Все</button></div>';
  h+='<label>Новые пункты добавляются в раздел</label><div class="cats">'+SEC.map(function(c){return '<button'+(shopSec===c[2]?' class="on"':"")+' data-ss="'+c[2]+'">'+c[1]+" "+esc(c[0])+'</button>'}).join("")+'</div>';
  h+='<div class="stk"><label for="si">Найти или добавить</label><input id="si" value="'+esc(sq)+'" placeholder="Начните вводить, например: молоко" autocomplete="off"><div id="st" class="stt">'+statusHtml()+'</div></div>';
  if(smode=="buy"&&lastB!==null){var k=sf(String(lastB));if(k>=0)h+='<div class="s" style="margin-top:10px">Куплено: '+esc(shop[k].n)+' <button class="lk" id="ub">Отменить</button></div>'}
  return h+'<div id="sr">'+resHtml()+'</div>'
}
function hl(n){var ql=sq.trim().toLowerCase(),k=ql?n.toLowerCase().indexOf(ql):-1;if(k<0)return esc(n);return esc(n.slice(0,k))+"<mark>"+esc(n.slice(k,k+ql.length))+"</mark>"+esc(n.slice(k+ql.length))}
function statusHtml(){
  var ql=sq.trim().toLowerCase();
  if(!ql)return '<span style="color:var(--mut)">Введите название, чтобы проверить, есть ли такой пункт.</span>';
  var m=shop.filter(function(x){return x.n.toLowerCase().indexOf(ql)>=0}).length,ex=shop.some(function(x){return x.n.toLowerCase()===ql});
  if(ex)return '<b class="pos">✔ Такой пункт уже есть</b>';
  return m?'<b>Похожих: '+m+'.</b> Точно такого пункта нет.':'<b style="color:var(--cr)">Такого пункта нет.</b> Его можно добавить.'
}
function itemRow(x){
  var c=isCat(x.s),n=c?!!x.b:!x.d,ic,st="",tag="",look=smode=="all"||sq.trim();
  if(c){ic=(n&&look)?"☑":"☐";if(!n)st=' style="color:var(--mut)"';else if(look){st=' style="font-weight:600"';tag='<span class="s">в списке</span>'}}
  else{ic=x.d?"☑":"☐";if(x.d)st=' style="text-decoration:line-through;color:var(--mut)"'}
  return '<div class="row" data-sd="'+x.id+'" style="cursor:pointer"><span style="font-size:22px">'+ic+'</span><div class="t"'+st+'>'+hl(x.n)+'</div>'+tag+'<button class="x" data-sx="'+x.id+'" aria-label="Удалить">×</button></div>'
}
function resHtml(){
  var ql=sq.trim().toLowerCase(),h="",any=false,G=SEC.slice();
  if(ql&&!shop.some(function(x){return x.n.toLowerCase()===ql}))h+='<div class="row addrow" data-sn="1" style="cursor:pointer;margin-top:10px"><span style="font-size:22px">＋</span><div class="t"><b>Добавить «'+esc(sq.trim())+'»</b> в раздел «'+esc(cat("s",shopSec)[0])+'»</div></div>';
  shop.forEach(function(x){if(!G.some(function(c){return c[2]===x.s}))G.push(cat("s",x.s))});
  G.forEach(function(c){
    var cm=isCat(c[2]),L=shop.filter(function(x){return x.s===c[2]});
    if(ql)L=L.filter(function(x){return x.n.toLowerCase().indexOf(ql)>=0});
    else if(smode=="buy"&&cm)L=L.filter(function(x){return x.b});
    if(!L.length)return;any=true;
    if(cm)L.sort(function(p,r){return p.n.localeCompare(r.n,"ru")});
    else L=L.filter(function(x){return !x.d}).concat(L.filter(function(x){return x.d}));
    var nd=L.filter(function(x){return cm?x.b:!x.d}).length,dn=cm?0:L.length-nd,cl=col[c[2]]&&!ql;
    h+='<div class="row" data-sh="'+c[2]+'" style="cursor:pointer;margin-top:10px"><span style="font-size:22px">'+c[1]+'</span><div class="t"><b>'+esc(c[0])+'</b></div><span class="s">'+(cm&&(smode=="all"||ql)?nd+" из "+L.length:nd)+" "+(cl?"▸":"▾")+'</span></div>';
    if(cl)return;
    h+=L.map(itemRow).join("");
    if(dn&&!ql)h+='<button class="lk" data-sc="'+c[2]+'">Убрать купленные ('+dn+')</button>';
  });
  if(!any&&!ql)h+='<div class="empty">'+(smode=="buy"?"Список пуст. Найдите пункт в поле выше или откройте вкладку «Все».":"Здесь пока ничего нет. Введите название, чтобы добавить первый пункт.")+'</div>';
  return h
}
function addS(){
  var v=sq.trim();if(!v||shopSec===null)return;
  var vl=v.toLowerCase(),x=null;
  for(var k=0;k<shop.length;k++)if(shop[k].n.toLowerCase()===vl){x=shop[k];break}
  if(x){x.b=1;x.d=0}else shop.push({id:Date.now()*1000+Math.floor(Math.random()*1000),n:v,s:shopSec,d:0,b:1});
  sq="";saveS();draw();if(g("si"))g("si").focus()
}
function keepS(){draw()}
function bindShop(top){
  var r=g("sr");if(!r)return;
  if(top){
    var si=g("si");
    si.oninput=function(){sq=si.value;g("st").innerHTML=statusHtml();g("sr").innerHTML=resHtml();bindShop(false)};
    si.onkeydown=function(e){if(e.key=="Enter"){e.preventDefault();addS()}};
    document.querySelectorAll("[data-ss]").forEach(function(b){b.onclick=function(){shopSec=+b.dataset.ss;draw()}});
    document.querySelectorAll("[data-md]").forEach(function(b){b.onclick=function(){smode=b.dataset.md;lastB=null;draw()}});
    if(g("ub"))g("ub").onclick=function(){var k=sf(String(lastB));if(k>=0){shop[k].b=1;saveS()}lastB=null;draw()};
  }
  r.querySelectorAll("[data-sh]").forEach(function(b){b.onclick=function(){col[b.dataset.sh]=!col[b.dataset.sh];draw()}});
  r.querySelectorAll("[data-sd]").forEach(function(b){b.onclick=function(){var k=sf(b.dataset.sd);if(k<0)return;var x=shop[k];
    if(isCat(x.s)){if(smode=="buy"&&!sq.trim()){x.b=0;lastB=x.id}else x.b=x.b?0:1}else x.d=x.d?0:1;
    saveS();draw()}});
  r.querySelectorAll("[data-sx]").forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=sf(b.dataset.sx);if(k>=0){shop.splice(k,1);saveS();draw()}}});
  r.querySelectorAll("[data-sc]").forEach(function(b){b.onclick=function(){shop=shop.filter(function(x){return !(x.s==b.dataset.sc&&x.d)});saveS();draw()}});
  r.querySelectorAll("[data-sn]").forEach(function(b){b.onclick=addS});
}
function sf(id){for(var k=0;k<shop.length;k++)if(String(shop[k].id)==id)return k;return -1}
function namesHtml(){
  var h='<h2>Имена</h2><div class="s" style="font-size:13px;color:var(--mut)">Они показываются на кнопках и в итогах.</div>';
  ["Первый человек","Второй человек","Общие расходы семьи"].forEach(function(l,k){h+='<label for="n'+k+'">'+l+'</label><input id="n'+k+'" maxlength="20" value="'+esc(WHO[k])+'" autocomplete="off">'});
  return h+'<button class="go" id="sn" style="margin-top:12px">Сохранить имена</button><div class="msg" role="status">'+esc(nmsg)+'</div>'
}
function currHtml(){
  return '<h2>Валюта</h2><div class="s" style="font-size:13px;color:var(--mut)">Уже внесённые суммы не пересчитываются, меняется только обозначение валюты.</div><div class="cats" style="grid-template-columns:1fr 1fr;margin-top:8px">'+Object.keys(CURS).map(function(k){return '<button'+(CUR==k?' class="on"':"")+' data-cur="'+k+'">'+CURS[k][0]+" "+CURS[k][1]+'</button>'}).join("")+'</div>'
}
function catsHtml(t,title){
  var h='<h2>'+title+'</h2>';
  LST(t).forEach(function(c,ix,arr){
    if(ed&&ed.t==t&&ed.id===c[2])h+=edHtml();
    else h+='<div class="row"><span style="font-size:22px">'+c[1]+'</span><div class="t">'+esc(c[0])+'</div>'+mvb(t,c[2],"top","⤒",ix==0)+mvb(t,c[2],"up","↑",ix==0)+mvb(t,c[2],"down","↓",ix==arr.length-1)+'<button class="lk" style="margin-left:6px" data-ed="'+t+":"+c[2]+'">Изменить</button></div>';
  });
  if(ed&&ed.t==t&&ed.id===null)h+=edHtml();
  else h+='<button class="lk" data-new="'+t+'" style="margin-top:6px">+ Добавить</button>';
  return h
}
function draw(){
  ["t0","t1","t2","t3"].forEach(function(k,n){g(k).className=(k=="t2"?"gear ":"")+(view==n?"on":"")});
  var h="",inc=cur.t=="i";ensure();
  if(view==0){
    h+='<h1>'+(eix!==null?"Изменить запись":"Новая запись")+'</h1>';
    h+='<label>'+(inc?"Кто получил":"Кто потратил")+'</label><div class="seg fam"><button class="p2'+(cur.who==2?" on":"")+'" data-w="2">👨‍👩‍👧 '+WHO[2]+'</button></div><div class="seg">'+WHO.slice(0,2).map(function(w,i){return '<button class="p'+i+(cur.who==i?" on":"")+'" data-w="'+i+'">'+w+'</button>'}).join("")+'</div>';
    h+='<div class="seg t" style="margin-top:14px"><button class="'+(inc?"":"on")+'" data-t="e">Расход</button><button class="'+(inc?"on":"")+'" data-t="i">Доход</button></div>';
    h+='<label>'+(inc?"Источник":"Категория")+'</label><div class="cats">'+LST(cur.t).map(function(c){return '<button'+(cur.cat==c[2]?' class="on"':"")+' data-c="'+c[2]+'">'+c[1]+" "+esc(c[0])+'</button>'}).join("")+'</div>';
    h+='<label for="amt">Сумма, '+CURS[CUR][0]+'</label><input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">';
    h+='<label for="dt">Дата</label><input id="dt" type="date" value="'+ds(now)+'"><label for="nt">Заметка</label><input id="nt" placeholder="Необязательно">';
    h+='<button class="go" id="go">'+(eix!==null?"Сохранить изменения":inc?"Добавить доход":"Добавить расход")+'</button>'+(eix!==null?'<button class="lk" id="ce" style="width:100%;margin-top:6px">Отмена</button>':"")+'<div class="msg'+(bad?" err":"")+'" role="status">'+esc(msg)+'</div>';
    var l=inMonth().map(function(x){return{x:x,i:items.indexOf(x)}}).sort(function(p,q){return q.x.d.localeCompare(p.x.d)});
    h+='<h2>Записи месяца</h2><div class="s" style="font-size:13px;color:var(--mut)">Нажмите на запись, чтобы изменить её.</div>';
    h+=l.length?l.slice(0,lim).map(function(o){var x=o.x,xi=x.t=="i",c=cat(xi?"i":"e",x.c);return '<div class="row" data-r="'+o.i+'" style="cursor:pointer'+(eix===o.i?";background:var(--fld)":"")+'"><span class="dot" style="background:'+COL[x.w]+'"></span><div class="t"><div>'+c[1]+" "+esc(x.n||c[0])+'</div><div class="s">'+WHO[x.w]+", "+dd(x.d)+'</div></div><b class="num'+(xi?" pos":"")+'">'+(xi?"+":"")+eur(x.a)+'</b><button class="x" data-x="'+o.i+'" aria-label="Удалить">×</button></div>'}).join(""):'<div class="empty">В этом месяце записей нет. Добавьте первую выше.</div>';
    if(l.length>lim)h+='<button class="lk" id="more" style="width:100%;padding:12px 0">Показать ещё ('+(l.length-lim)+')</button>';
    if(items.some(function(x){return x.demo}))h+='<div class="tiny">Это примеры. <button id="cd">Удалить примеры</button></div>';
  }else if(view==1){
    var L=inMonth(),tot=[0,0,0],by={},ti=[0,0,0];
    L.forEach(function(x){if(x.t=="i")ti[x.w]+=x.a;else{tot[x.w]+=x.a;var b=by[x.c]||(by[x.c]=[0,0,0]);b[x.w]+=x.a}});
    var T=tot[0]+tot[1]+tot[2],I=ti[0]+ti[1]+ti[2],B=I-T;
    h+='<h1>Итоги</h1><div class="nav"><button id="pv" aria-label="Предыдущий месяц">‹</button><b>'+mo.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button id="nx" aria-label="Следующий месяц">›</button></div>';
    h+='<div class="s" style="color:var(--mut)">Остаток за месяц</div><div class="num big'+(B<0?" err":"")+'">'+eur(B)+'</div>';
    h+='<div class="who"><span>Доходы <b class="num pos">+'+eur(I)+'</b></span><span>Расходы <b class="num">'+eur(T)+'</b></span></div>';
    if(I>0)h+='<div class="s" style="font-size:13px;color:var(--mut);margin-top:6px">Доход: '+who3(ti)+'</div>';
    if(T>0){
      h+='<h2>Расходы: кто и на что</h2>'+bar3(tot,T,"");
      h+='<div class="who" style="flex-wrap:wrap;gap:6px 14px">'+[0,1,2].map(function(k){return '<span><span class="dot" style="display:inline-block;background:'+COL[k]+'"></span> '+WHO[k]+' <b class="num">'+eur(tot[k])+'</b></span>'}).join("")+'</div>';
      h+=Object.keys(by).map(function(k){return{c:cat("e",+k),b:by[k],s:by[k][0]+by[k][1]+by[k][2]}}).sort(function(p,q){return q.s-p.s}).map(function(o){
        var b=o.b;return '<div class="cat"><div class="h"><span>'+o.c[1]+" "+esc(o.c[0])+'</span><b class="num">'+eur(o.s)+'</b></div>'+bar3(b,o.s,"width:"+Math.max(8,o.s/T*100)+"%")+'<div class="s" style="font-size:13px;color:var(--mut);margin-top:6px">'+who3(b)+'</div></div>'}).join("");
    }else if(I==0)h+='<div class="empty">За этот месяц данных нет.</div>';
  }else if(view==3){h+=shopHtml()}else{
    h+='<h1>Настройки</h1>'+namesHtml()+currHtml()+catsHtml("e","Категории расходов")+catsHtml("i","Источники доходов")+catsHtml("s","Разделы списка покупок");
  }
  g("app").innerHTML=h;
  if(g("sn"))g("sn").onclick=function(){var r=[0,1,2].map(function(k){var v=g("n"+k).value.replace(/[<>&"]/g,"").trim();return v||WHO[k]});WHO=r;try{localStorage.setItem("names",JSON.stringify(WHO))}catch(e){}nmsg="Имена сохранены.";draw()};
  document.querySelectorAll("[data-cur]").forEach(function(b){b.onclick=function(){CUR=b.dataset.cur;try{localStorage.setItem("cur",CUR)}catch(e){}draw()}});
  if(view==3)bindShop(true);
  if(g("more"))g("more").onclick=function(){lim+=10;keep()};
  if(g("go"))g("go").onclick=add;if(g("cd"))g("cd").onclick=clearDemo;
  if(g("pv"))g("pv").onclick=function(){mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);draw()};
  if(g("nx"))g("nx").onclick=function(){mo=new Date(mo.getFullYear(),mo.getMonth()+1,1);draw()};
  document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){cur.t=b.dataset.t;cur.cat=0;msg="";bad=false;ensure();keep()}});
  document.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){cur.who=+b.dataset.w;keep()}});
  document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){cur.cat=+b.dataset.c;keep()}});
  document.querySelectorAll("[data-r]").forEach(function(r){r.onclick=function(){startEdit(+r.dataset.r)}});
  if(g("ce"))g("ce").onclick=function(){eix=null;msg="";draw()};
  document.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(e){e.stopPropagation();del(+b.dataset.x)}});
  document.querySelectorAll("[data-mv]").forEach(function(b){b.onclick=function(){var p=b.dataset.mv.split(":"),L=LST(p[0]),k=L.findIndex(function(c){return c[2]==+p[1]});if(k<0)return;var c=L.splice(k,1)[0],n=p[2]=="top"?0:p[2]=="up"?k-1:k+1;L.splice(Math.max(0,n),0,c);saveC();draw()}});
  document.querySelectorAll("[data-ed]").forEach(function(b){b.onclick=function(){var p=b.dataset.ed.split(":"),c=cat(p[0],+p[1]);ed={t:p[0],id:+p[1],n:c[0],e:c[1],k:c[3]?1:0};draw()}});
  document.querySelectorAll("[data-new]").forEach(function(b){b.onclick=function(){ed={t:b.dataset.new,id:null,n:"",e:"📦",k:0};draw()}});
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){ed.n=g("en").value;ed.k=+b.dataset.k;draw()}});
  document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){ed.n=g("en").value;ed.e=b.dataset.e;draw()}});
  document.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(b.dataset.a)}});
}
function act(a){
  if(a=="c"){ed=null;return draw()}
  if(a=="x"){ed.n=g("en").value;ed.conf=true;return draw()}
  var L=LST(ed.t);
  if(a=="d"){for(var k=0;k<L.length;k++)if(L[k][2]===ed.id)L.splice(k,1);saveC();ed=null;return draw()}
  var n=g("en").value.trim();ed.n=n;
  if(!n){ed.err="Введите название.";return draw()}
  if(ed.id===null)L.push([n,ed.e,NX++,ed.k]);else for(var k=0;k<L.length;k++)if(L[k][2]===ed.id){
    if(ed.t=="s"&&(L[k][3]?1:0)!==ed.k){shop.forEach(function(x){if(x.s===ed.id){if(ed.k)x.b=x.d?0:1;else x.d=x.b?0:1}});saveS()}
    L[k][0]=n;L[k][1]=ed.e;L[k][3]=ed.k}
  saveC();ed=null;draw()
}
function keep(){var a=g("amt").value,d=g("dt").value,n=g("nt").value;draw();g("amt").value=a;g("dt").value=d;g("nt").value=n}
function tab(n){if(view==n){window.scrollTo({top:0,behavior:"smooth"});return}view=n;nmsg="";if(n==2)ed=null;window.scrollTo(0,0);draw()}
g("t0").onclick=function(){tab(0)};
g("t1").onclick=function(){tab(1)};
g("t2").onclick=function(){if(view==2)tab(prev);else{prev=view;tab(2)}};
g("t3").onclick=function(){tab(3)};
g("up").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
window.addEventListener("scroll",function(){g("up").className="up"+((window.pageYOffset||document.documentElement.scrollTop)>300?" show":"")});
draw();
</script>
</body>
</html>
